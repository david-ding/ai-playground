name: Pull request workflow

on:
  pull_request:
    branches:
      - master

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - command: lint
            name: Lint
          - command: typecheck
            name: Typecheck
    permissions:
      contents: read
      packages: read
    concurrency:
      group: playwright-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    container:
      image: ghcr.io/david-ding/ci-toolchain:stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.yarn-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.yarn-cache
          key: yarn-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ${{ matrix.name }}
        run: yarn ${{ matrix.command }}

  vr-gate:
    uses: ./.github/workflows/_vr-gate.yml
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
