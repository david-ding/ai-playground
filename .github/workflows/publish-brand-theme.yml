name: Publish brand-theme

on:
  push:
    tags:
      - "brand-theme-v*"

jobs:
  vr-gate:
    uses: ./.github/workflows/_vr-gate.yml
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: vr-gate
    permissions:
      contents: read
      packages: write
    container:
      image: ghcr.io/david-ding/ci-toolchain:stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.yarn-cache
    steps:
      - uses: actions/checkout@v7

      - name: Cache yarn dependencies
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.yarn-cache
          key: yarn-${{ hashFiles('yarn.lock') }}

      - run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm publish
        working-directory: packages/brand-theme
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
