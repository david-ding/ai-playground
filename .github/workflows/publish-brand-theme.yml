name: Publish brand-theme

on:
  push:
    tags:
      - "brand-theme-v*"

jobs:
  vr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: .nvmrc
          cache: yarn

      - run: corepack enable

      - run: yarn install --immutable

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build and compare all brand snapshots
        run: yarn vr:test

  publish:
    runs-on: ubuntu-latest
    needs: vr-gate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@david-ding"

      - run: corepack enable

      - run: yarn install --immutable

      - run: npm publish
        working-directory: packages/brand-theme
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
